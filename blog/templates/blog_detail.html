{% extends "layout.html" %}

{% block meta %}
<meta name="description" content="{{ blog_obj.content | truncatechars:150 }}">
<meta name="keywords" content="{{blog_obj.title}}, choose a movie for me, movie for me, movie suggestions, movie recommendations, pick a movie, recommend me a movie, what movie to watch, suggest me a movie, movie suggestion website, movie recommendation website, movieforme, movie for me, movie suggestions, movie recommendations, pick a movie, recommend me a movie, what movie to watch, suggest me a movie, movie suggestion website, movie recommendation website, movieforme, similar movies, best similar movies, movie picker, best similar movies, movie picker app, date night movie picker, random movie, couple movie picker, random movie picker, movie date picker, movie picker for couples, similar movie generator, random movie suggestions, similar movie finder, disney movie picker, pick a random movie">
{% endblock %}

{% block title %}
{{blog_obj.title}}
{% endblock %}

{% block content %}

<main class="pt-8 pb-16 lg:pt-16 lg:pb-24 antialiased">
   <div class="flex justify-between mx-auto px-10 md:w-2/3 md:py-8 bg-[#1c1c1cd6] md:rounded-2xl border-y-2 border-x-0 border-solid md:border-2 border-white">
       <article class="mx-auto w-full md:max-w-2xl py-5 md:py-0 format format-sm sm:format-base lg:format-lg format-blue dark:format-invert">
           <header class="mb-4 w-full lg:mb-6 not-format">
               <address class="flex items-center mb-6 not-italic">
                   <div class="inline-flex items-center mr-3 text-sm text-gray-900 dark:text-white">
                       <div>
                           <a href="#" rel="author" class="md:text-xl text-base font-semibold md:font-bold text-white dark:text-white">Author: {{blog_obj.author}}</a>
                           <p class="md:text-base text-xs text-gray-400 dark:text-gray-400"><time pubdate datetime="2022-02-08" title="{{blog_obj.created_at}}">{{blog_obj.created_at}}</time></p>
                       </div>
                   </div>
               </address>
               <h1 class="mb-4 text-xl md:text-3xl font-bold md:font-extrabold leading-tight text-white md:mb-6 dark:text-white">{{blog_obj.title}}</h1>
           </header>
           <div class="mb-6 text-slate-200 bg-transparent text-base md:text-lg tracking-tight md:tracking-normal">
               <p class=''>{{blog_obj.content | safe}}</p>
            </div>
            

           
       </article>
   </div>
 </main>
 

{% endblock %}
