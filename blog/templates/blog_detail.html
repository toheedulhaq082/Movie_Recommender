{% extends "layout.html" %}

{% block title %}
{{blog_obj.title}}
{% endblock %}

{% block content %}

<main class="pt-8 pb-16 lg:pt-16 lg:pb-24 dark:bg-gray-900 antialiased">
   <div class="flex justify-between mx-auto px-10 md:w-2/3 md:py-8 bg-[#1c1c1cd6] md:rounded-2xl border-y-2 border-x-0 border-solid md:border-2 border-white">
       <article class=" mx-auto w-full max-w-2xl py-5 md:py-0 format format-sm sm:format-base lg:format-lg format-blue dark:format-invert">
           <header class="mb-4 lg:mb-6 not-format">
               <address class="flex items-center mb-6 not-italic">
                   <div class="inline-flex items-center mr-3 text-sm text-gray-900 dark:text-white">
                       <img class="mr-4 w-16 h-16 rounded-full" src="../media/images/author.jpg" alt="Jese Leos">
                       <div>
                           <a href="#" rel="author" class="text-xl font-bold text-white dark:text-white">{{blog_obj.author}}</a>
                           <p class="text-base text-gray-400 dark:text-gray-400"><time pubdate datetime="2022-02-08" title="{{blog_obj.created_at}}">{{blog_obj.created_at}}</time></p>
                       </div>
                   </div>
               </address>
               <h1 class="mb-4 text-3xl font-extrabold leading-tight text-white lg:mb-6 lg:text-4xl dark:text-white">{{blog_obj.title}}</h1>
           </header>
           <div class="mb-6 text-lg text-slate-400">
           <p>{{blog_obj.content | safe}}</p>
              </div>

           
       </article>
   </div>
 </main>
 

{% endblock %}
